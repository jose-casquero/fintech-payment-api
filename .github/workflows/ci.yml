name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-quality:
    name: Build, Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test & JaCoCo Coverage Check
        run: mvn -B verify --file pom.xml

  deploy:
    name: Automated Deployment (CD)
    needs: build-and-quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Verify Deployment Readiness
        run: |
          echo "Deployment pipeline execution verified successfully."
          echo "The Java Spring Boot application is ready for production."